<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="GIST Nellore emblem">
  <defs>
    <linearGradient id="gistRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gistBook" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5edff"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" fill="url(#gistRing)"/>
  <circle cx="60" cy="60" r="51" fill="#0f2557"/>

  <!-- Laurel-style side ticks -->
  <g stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <path d="M14 52 Q9 60 14 68"/>
    <path d="M18 44 Q11 60 18 76"/>
    <path d="M106 52 Q111 60 106 68"/>
    <path d="M102 44 Q109 60 102 76"/>
  </g>

  <!-- Graduation cap -->
  <g transform="translate(60,38)">
    <polygon points="0,-9 22,0 0,9 -22,0" fill="#ffffff"/>
    <polygon points="0,-9 22,0 0,9 -22,0" fill="none" stroke="#1e3a8a" stroke-width="1.2"/>
    <rect x="-6" y="0" width="12" height="6.5" rx="1.4" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1"/>
    <line x1="16" y1="3" x2="16" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="2.2" fill="#facc15"/>
  </g>

  <!-- Open book -->
  <g transform="translate(60,66)">
    <path d="M-26 -5 C -15 -12 -7 -12 0 -5 C 7 -12 15 -12 26 -5 L 26 13 C 15 6 7 6 0 13 C -7 6 -15 6 -26 13 Z"
          fill="url(#gistBook)" stroke="#1e3a8a" stroke-width="1.4"/>
    <line x1="0" y1="-5" x2="0" y2="13" stroke="#1e3a8a" stroke-width="1.4"/>
    <path d="M-19 -1 L-6 -1 M-19 4 L-6 4 M-19 9 L-9 9" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M19 -1 L6 -1 M19 4 L6 4 M19 9 L9 9" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="94" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="2" text-anchor="middle">GIST</text>
  <text x="60" y="103" font-family="Inter, Arial, sans-serif" font-size="6.5" font-weight="600" fill="#93c5fd" letter-spacing="2" text-anchor="middle">NELLORE</text>
</svg>
